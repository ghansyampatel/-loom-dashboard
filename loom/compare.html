<!DOCTYPE html>
<html>
<head>
<!-- © 2026 Factory Monitor — All rights reserved -->
<meta name="robots" content="noindex">
<script src="../api.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom Compare</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#000; --surface:#141414; --surface-2:#1d1d1d; --line:#2a2a2a;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8b8a83;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --good:#22c55e; --warn:#facc15; --bad:#ef4444; --off:#6b7280;
    --track:#262626; --stop:#4b4b48;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text-primary);font-family:Arial,Helvetica,sans-serif}
  body{padding:clamp(10px,1.2vw,24px);display:flex;flex-direction:column;gap:clamp(10px,1vw,20px);max-width:1900px;margin:0 auto}

  header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:clamp(20px,2vw,40px);color:#0ff;letter-spacing:.12em}
  .sub{font-size:clamp(12px,1vw,18px);color:var(--text-secondary)}
  .clock{font-size:clamp(20px,2vw,40px);font-weight:900;font-variant-numeric:tabular-nums}
  .shift{display:flex;align-items:center;gap:12px}
  .shift .sub{white-space:nowrap}
  .shiftbar{flex:1;height:10px;background:var(--track);border-radius:20px;overflow:hidden}
  .shiftbar i{display:block;height:100%;background:#38bdf8}

  /* ---------- 4 बड़े cards: 2 × 2 ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1vw,20px)}
  .card{background:var(--surface);border:2px solid var(--line);border-top:10px solid var(--c);border-radius:16px;
        padding:clamp(12px,1.4vw,28px);display:flex;flex-direction:column;gap:clamp(8px,1vw,18px);
        min-height:clamp(220px,38vh,520px);cursor:pointer;position:relative;transition:border-color .15s, transform .15s}
  .card:hover{border-color:#555;border-top-color:var(--c)}
  .card.sel{border-color:var(--c);box-shadow:0 0 0 3px var(--c) inset}
  .card.sel::after{content:'▼ DETAILS';position:absolute;right:clamp(12px,1.4vw,28px);bottom:8px;font-size:clamp(10px,.8vw,14px);
        font-weight:900;letter-spacing:.1em;color:var(--c)}
  .card.offline{opacity:.6}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .id b{font-size:clamp(32px,4vw,80px);line-height:1;font-weight:900;color:var(--c)}
  .id span{display:block;font-size:clamp(12px,1vw,20px);color:var(--text-secondary)}
  .st{font-weight:900;font-size:clamp(14px,1.6vw,32px);padding:.2em .8em;border-radius:40px;color:#000;white-space:nowrap}
  .mid{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(8px,1vw,20px);align-items:end}
  .lbl{font-size:clamp(11px,.9vw,17px);color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
  .big{font-size:clamp(34px,5vw,104px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
  .big small{font-size:.35em;color:var(--text-secondary);font-weight:600}
  .eff{font-size:clamp(30px,4.2vw,88px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;text-align:right}
  .eff + .lbl, .mid > div:last-child .lbl{text-align:right}
  .prog{position:relative;height:clamp(12px,1.3vw,24px);background:var(--track);border-radius:0 6px 6px 0}
  .prog .bar{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:0 6px 6px 0}
  .prog .tick{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--text-primary)}
  .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,.6vw,12px);margin-top:auto}
  .mini div{background:var(--surface-2);border-radius:10px;padding:clamp(6px,.6vw,12px)}
  .mini b{display:block;font-size:clamp(16px,1.8vw,36px);font-variant-numeric:tabular-nums}
  .mini em{font-style:normal;font-size:.55em;color:var(--text-muted);font-weight:400}

  /* ---------- चुने हुए loom का detail ---------- */
  .detail{background:var(--surface);border:2px solid var(--c);border-radius:16px;padding:clamp(12px,1.4vw,28px);
          display:flex;flex-direction:column;gap:clamp(12px,1.2vw,24px)}
  .dh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .dh h2{font-size:clamp(20px,2vw,40px);color:var(--c)}
  .dh h2 span{color:var(--text-secondary);font-size:.6em;font-weight:400;margin-left:10px}
  .pick{display:flex;gap:8px}
  .pick button{font:inherit;font-weight:900;font-size:clamp(13px,1vw,18px);padding:.4em 1em;border-radius:8px;
        border:2px solid var(--b);background:transparent;color:var(--text-primary);cursor:pointer}
  .pick button.on{background:var(--b);color:#000}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:clamp(8px,.8vw,14px)}
  .tiles div{background:var(--surface-2);border-radius:10px;padding:clamp(8px,.8vw,14px)}
  .tiles b{display:block;font-size:clamp(18px,1.7vw,34px);font-variant-numeric:tabular-nums;margin-top:2px}
  .tiles em{font-style:normal;font-size:.55em;color:var(--text-muted);font-weight:400}
  .meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(10px,1vw,20px)}
  .meter h3{font-size:clamp(14px,1.1vw,20px);display:flex;justify-content:space-between;margin-bottom:6px}
  .meter h3 b{font-variant-numeric:tabular-nums}
  .meter p{font-size:12px;color:var(--text-muted);margin-top:4px}
  .track{position:relative;height:clamp(18px,1.6vw,28px);background:var(--track);border-radius:0 6px 6px 0}
  .track .bar{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:0 6px 6px 0}
  .track .bar.stop{background:var(--stop)}
  .track .tick{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--text-primary)}
  .lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(10px,1vw,20px)}
  .lists h3{font-size:clamp(14px,1.1vw,20px);margin-bottom:8px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.08em}
  .tw{overflow-x:auto;background:var(--surface-2);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:clamp(13px,.95vw,17px);white-space:nowrap}
  th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
  th{color:var(--text-muted);font-weight:700;font-size:.85em;text-transform:uppercase}
  tr:last-child td{border-bottom:none}
  .ev-STOP{color:var(--warn);font-weight:700} .ev-RUN{color:var(--good);font-weight:700}
  .ev-OFF{color:var(--bad);font-weight:700}
  .empty{color:var(--text-muted);padding:16px;text-align:center}

  @media (max-width:560px){
    .grid{grid-template-columns:1fr 1fr;gap:8px}
    .card{min-height:0;padding:10px;border-top-width:7px}
    .mid{grid-template-columns:1fr}
    .mid > div:last-child .lbl,.eff{text-align:left}
    .mini{grid-template-columns:1fr 1fr}
    .mini div:nth-child(3){display:none}
    .card.sel::after{display:none}
  }
  /* ---------- कौन से 4 looms ---------- */
  .chooser{display:flex;flex-direction:column;gap:8px}
  .crow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .crow .lbl2{font-size:clamp(12px,.9vw,16px);color:var(--text-secondary);margin-right:4px}
  .chip{font:inherit;font-weight:700;font-size:clamp(12px,.9vw,16px);padding:.35em .8em;border-radius:8px;cursor:pointer;
        border:2px solid var(--line);background:var(--surface);color:var(--text-primary)}
  .chip.on{background:var(--c,#0ff);border-color:var(--c,#0ff);color:#000}
  .chip.grp.on{background:#0ff;border-color:#0ff}
  .chip.edit{border-color:#0ff;color:#0ff}
  .chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--dot)}
  #all{display:none} #all.open{display:flex}
</style>
</head>
<body>
  <header>
    <div>
      <h1 id="ttl">LOOM COMPARE</h1>
      <div class="sub" id="upd">Loading…</div>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </header>
  <div class="shift">
    <div class="sub" id="shiftTxt">Shift</div>
    <div class="shiftbar"><i id="shiftBar" style="width:0%"></i></div>
  </div>

  <div class="chooser">
    <div class="crow" id="groups"></div>
    <div class="crow" id="all"></div>
  </div>

  <div class="grid" id="grid"><div class="empty">Loading…</div></div>
  <div id="detail"></div>

<script>
const REFRESH_MS = 15000;
const COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];   // loom पहचान का रंग
const ST = { RUN: ['var(--good)', 'RUN'], STOP: ['var(--warn)', 'STOP'], OFF: ['var(--bad)', 'OFF'], OFFLINE: ['var(--off)', 'OFFLINE'] };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let QQ = {};
const qd = k => QQ[k] ? `<em class="qdot" title="${esc(QQ[k].name)}" style="display:inline-block;width:.7em;height:.7em;border-radius:50%;background:${QQ[k].color};border:2px solid #fff;box-shadow:0 0 0 1.5px #000;vertical-align:middle;margin-left:.2em;font-style:normal"></em>` : '';
const setQ = d => { QQ = {}; (d.qualities || []).forEach(q => QQ[q.key] = q); };
const f1 = n => (Math.round((n || 0) * 10) / 10).toFixed(1);
function hms(s){ s = Math.round(s || 0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h + ':' + String(m).padStart(2,'0') + ':' + String(x).padStart(2,'0'); }
const pct = (a, b) => b > 0 ? a / b * 100 : 0;
const clamp = v => Math.max(0, Math.min(100, v));
function effColor(e){ return e >= 85 ? 'var(--good)' : e >= 70 ? 'var(--warn)' : 'var(--bad)'; }

let colorOf = {};
let DATA = null;
let selected = null;
let chosen = [];          // तुलना के लिए चुने गए 4 looms
let pickOpen = false;
try { selected = localStorage.getItem('cmpSel'); chosen = JSON.parse(localStorage.getItem('cmpLooms') || '[]') || []; } catch (e) {}
const LOOMS_PER_ESP = 4;   // तुलना के group (4 रंग). ESP नंबर Settings के Looms_Per_ESP से
const byNum = (a, b) => String(a).localeCompare(String(b), undefined, {numeric:true});
function saveChosen(){ try { localStorage.setItem('cmpLooms', JSON.stringify(chosen)); } catch (e) {} }

function assignColors(looms){
  colorOf = {};
  looms.forEach((l, i) => colorOf[l.id] = COLORS[i % COLORS.length]);   // चुने हुए 4 में जगह के हिसाब से रंग
}

setInterval(() => $('clock').textContent = new Date().toLocaleTimeString('en-IN', {hour12:false}), 1000);

// ---------- बड़ा card ----------
function card(l){
  const st = ST[l.status] || ST.OFFLINE;
  const run = l.runS || 0, stop = l.stopS || 0;
  const runPct = pct(run, run + stop);
  const max = Math.max(l.target || 0, l.shiftM || 0, 1);
  const tick = l.planNow > 0 ? `<i class="tick" style="left:calc(${clamp(l.planNow / max * 100)}% - 1px)"></i>` : '';
  const cls = 'card' + (l.id === selected ? ' sel' : '') + (l.status === 'OFFLINE' ? ' offline' : '');
  return `<div class="${cls}" style="--c:${colorOf[l.id]}" data-id="${esc(l.id)}">
    <div class="top">
      <div class="id"><b>${esc(l.id)}${qd(l.qual)}</b><span>${esc(l.name)}</span></div>
      <div class="st" style="background:${st[0]}">${st[1]}</div>
    </div>
    <div class="mid">
      <div>
        <div class="lbl">Shift meters / target</div>
        <div class="big">${f1(l.shiftM)} <small>/ ${f1(l.target)} m</small></div>
      </div>
      <div>
        <div class="eff" style="color:${effColor(l.eff || 0)}">${f1(l.eff)}%</div>
        <div class="lbl">Efficiency</div>
      </div>
    </div>
    <div class="prog"><div class="bar" style="width:${clamp((l.shiftM || 0) / max * 100)}%"></div>${tick}</div>
    <div class="mini">
      <div><span class="lbl">RPM</span><b>${Math.round(l.rpm || 0)} <em>/ ${l.rpmMode === 'AUTO' ? 'auto ' : ''}${Math.round(l.setRpm || 0)}</em></b></div>
      <div><span class="lbl">Run</span><b>${Math.round(runPct)}% <em>${hms(run)}</em></b></div>
      <div><span class="lbl">Stop</span><b>${hms(stop)}</b></div>
    </div>
  </div>`;
}

// ---------- एक bar (detail में) ----------
function meter(title, valTxt, widthPct, note, tickPct, stacked){
  const bars = stacked != null
    ? `<div class="bar" style="width:calc(${stacked}% - 1px)"></div><div class="bar stop" style="left:calc(${stacked}% + 1px);width:calc(${100 - stacked}% - 1px)"></div>`
    : `<div class="bar" style="width:${clamp(widthPct)}%"></div>`;
  const tick = tickPct > 0 ? `<i class="tick" style="left:calc(${clamp(tickPct)}% - 1px)"></i>` : '';
  return `<div class="meter"><h3><span>${title}</span><b>${valTxt}</b></h3>
    <div class="track">${bars}${tick}</div><p>${note}</p></div>`;
}

// ---------- चुने हुए loom का पूरा detail ----------
function detail(l, L, d){
  const run = l.runS || 0, stop = l.stopS || 0;
  const runPct = pct(run, run + stop);
  const ach = pct(l.shiftM, l.planNow);
  const beamLeft = Math.max(0, (l.beamLen || 0) - (l.beamM || 0));
  const mMax = Math.max(l.target || 0, l.shiftM || 0, 1);
  const rMax = Math.max(l.rpm || 0, l.setRpm || 0, 1) * 1.1;

  const buttons = L.map(x => `<button class="${x.id === l.id ? 'on' : ''}" style="--b:${colorOf[x.id]}" data-id="${esc(x.id)}">${esc(x.id)}</button>`).join('');

  const tiles = [
    ['Plan अभी तक', f1(l.planNow) + ' <em>m</em>'],
    ['Achievement', Math.round(ach) + '<em>%</em>'],
    ['Picks', (l.picks || 0).toLocaleString('en-IN')],
    ['Short stops', (l.shortStops || 0) + ' <em>' + hms(l.shortStopS) + '</em>'],
    ['Beam', esc(l.beam)],
    ['Beam left', Math.round(beamLeft) + ' <em>m</em>'],
    ['WiFi', esc(l.rssi) + ' <em>dBm</em>'],
    ['Updated', esc(l.updated)],
  ].map(([k, v]) => `<div><span class="lbl">${k}</span><b>${v}</b></div>`).join('');

  const meters = [
    meter('Shift meters', f1(l.shiftM) + ' / ' + f1(l.target) + ' m', (l.shiftM || 0) / mMax * 100,
          'सफ़ेद निशान = अभी तक का plan (' + f1(l.planNow) + ' m)', (l.planNow || 0) / mMax * 100),
    meter('Efficiency', f1(l.eff) + '%', l.eff || 0, '0–100%'),
    meter('RPM', Math.round(l.rpm || 0) + ' <span style="color:var(--text-muted)">/ ' + (l.rpmMode === 'AUTO' ? 'auto ' : 'set ') + Math.round(l.setRpm || 0) + '</span>',
          (l.rpm || 0) / rMax * 100, (l.rpmMode === 'AUTO' ? 'सफ़ेद निशान = AUTO सीखा हुआ पूरी speed RPM' : 'सफ़ेद निशान = set RPM (Loom_Config)'), (l.setRpm || 0) / rMax * 100),
    meter('Run vs Stop', Math.round(runPct) + '% run', 0, 'रंगीन = चला ' + hms(run) + ' · स्लेटी = रुका ' + hms(stop), 0, runPct),
    meter('Beam progress', f1(l.beamM) + ' / ' + f1(l.beamLen) + ' m', pct(l.beamM, l.beamLen), Math.round(pct(l.beamM, l.beamLen)) + '% बुना गया'),
  ].join('');

  // Event log: [Date, Time, Loom_ID, Event, Detail]
  const ev = (d.events || []).filter(r => String(r[2]) === String(l.id)).slice(0, 12);
  const evHtml = ev.length
    ? '<div class="tw"><table><thead><tr><th>Date</th><th>Time</th><th>Event</th><th>Detail</th></tr></thead><tbody>' +
      ev.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="ev-${esc(r[3])}">${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`).join('') +
      '</tbody></table></div>'
    : '<div class="tw"><div class="empty">इस loom का कोई हाल का event नहीं</div></div>';

  // Shift summary: [Date, Shift, Loom_ID, Picks, Meters, Eff, Run, Stop, Beam, Short, Short time]
  const sm = (d.summary || []).filter(r => String(r[2]) === String(l.id)).slice(0, 8);
  const smHtml = sm.length
    ? '<div class="tw"><table><thead><tr><th>Date</th><th>Shift</th><th>Meters</th><th>Eff %</th><th>Run</th><th>Stop</th><th>Short</th><th>Quality</th></tr></thead><tbody>' +
      sm.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[4])}</td><td>${esc(r[5])}</td><td>${esc(r[6])}</td><td>${esc(r[7])}</td><td>${esc(r[9])}</td><td>${qd(r[11])}${esc(QQ[r[11]] ? QQ[r[11]].name : '')}</td></tr>`).join('') +
      '</tbody></table></div>'
    : '<div class="tw"><div class="empty">अभी कोई shift summary नहीं</div></div>';

  return `<div class="detail" style="--c:${colorOf[l.id]}">
    <div class="dh"><h2>${esc(l.id)} details<span>${esc(l.name)} · ${esc(l.status)}</span></h2><div class="pick">${buttons}</div></div>
    <div class="tiles">${tiles}</div>
    <div class="meters">${meters}</div>
    <div class="lists">
      <div><h3>हाल के events</h3>${evHtml}</div>
      <div><h3>पिछली shifts</h3>${smHtml}</div>
    </div>
  </div>`;
}

function render(d){
  setQ(d);
  if (d) DATA = d;
  d = DATA;
  if (!d) return;
  if (d.company) $('ttl').textContent = d.company.toUpperCase() + ' · COMPARE';
  $('upd').textContent = 'Updated ' + d.server + ' · हर 15 सेकंड · card दबाएँ = detail · ऊपर ESP चुनें';
  const s = d.shiftNow || {};
  $('shiftTxt').textContent = (s.name || '') + ' shift · ' + (s.elapsedTxt || '') + ' / ' + (s.lenTxt || '');
  $('shiftBar').style.width = (s.pct || 0) + '%';

  const ALL = (d.looms || []).slice().sort((a, b) => byNum(a.id, b.id));
  if (!ALL.length) { $('grid').innerHTML = '<div class="empty">कोई loom data नहीं</div>'; $('detail').innerHTML = ''; return; }

  // चुने हुए looms (जो अब मौजूद नहीं, उन्हें हटाओ; खाली हो तो पहले 4)
  chosen = chosen.filter(id => ALL.some(l => l.id === id)).slice(0, 4);
  if (!chosen.length) chosen = ALL.slice(0, 4).map(l => l.id);
  const L = chosen.map(id => ALL.find(l => l.id === id));
  assignColors(L);
  if (!L.some(l => l.id === selected)) selected = L[0].id;

  drawChooser(ALL);
  $('grid').innerHTML = L.map(card).join('');
  $('detail').innerHTML = detail(L.find(l => l.id === selected), L, d);
}

// ---------- ऊपर: ESP group buttons + किसी भी 4 looms को चुनना ----------
function espOf(id){ const n = parseInt(String(id).replace(/\D/g, ''), 10) || 1; return Math.ceil(n / ((DATA && DATA.loomsPerEsp) || 4)); }
function drawChooser(ALL){
  const ids = ALL.map(l => l.id);
  const groups = [];
  for (let i = 0; i < ids.length; i += LOOMS_PER_ESP) groups.push(ids.slice(i, i + LOOMS_PER_ESP));
  const same = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
  $('groups').innerHTML = '<span class="lbl2">Compare:</span>' +
    groups.map((g, i) => `<button class="chip grp ${same(g, chosen) ? 'on' : ''}" data-grp="${esc(g.join(','))}">${esc((DATA && DATA.groupLabel) || 'ESP')}${espOf(g[0])} <small>${esc(g[0])}–${esc(g[g.length - 1])}</small></button>`).join('') +
    `<button class="chip edit" data-toggle="1">${pickOpen ? '✓ Done' : '✎ कोई भी 4 चुनें'}</button>`;
  const st = id => (ALL.find(l => l.id === id) || {}).status;
  const dot = id => ({RUN:'var(--good)',STOP:'var(--warn)',OFF:'var(--bad)'})[st(id)] || 'var(--off)';
  $('all').classList.toggle('open', pickOpen);
  $('all').innerHTML = pickOpen
    ? '<span class="lbl2">दबाकर चुनें / हटाएँ (max 4):</span>' + ids.map(id => {
        const k = chosen.indexOf(id);
        return `<button class="chip ${k >= 0 ? 'on' : ''}" style="--c:${k >= 0 ? COLORS[k] : ''};--dot:${dot(id)}" data-pick="${esc(id)}"><i></i>${esc(id)}</button>`;
      }).join('')
    : '';
}

function select(id){
  selected = id;
  try { localStorage.setItem('cmpSel', id); } catch (e) {}
  render();
}

// card या button दबाने पर
document.addEventListener('click', e => {
  if (!e.target.closest) return;
  const g = e.target.closest('[data-grp]');
  if (g) { chosen = g.dataset.grp.split(','); selected = chosen[0]; saveChosen(); render(); return; }
  if (e.target.closest('[data-toggle]')) { pickOpen = !pickOpen; render(); return; }
  const p = e.target.closest('[data-pick]');
  if (p) {
    const id = p.dataset.pick, k = chosen.indexOf(id);
    if (k >= 0) { if (chosen.length > 1) chosen.splice(k, 1); }
    else { if (chosen.length >= 4) chosen.shift(); chosen.push(id); }
    saveChosen(); render(); return;
  }
  const t = e.target.closest('[data-id]');
  if (t) select(t.dataset.id);
});
// TV remote / keyboard: 1-4 या ← →
document.addEventListener('keydown', e => {
  if (!DATA) return;
  const ids = chosen.slice();
  const i = ids.indexOf(selected);
  if (e.key >= '1' && e.key <= '4' && ids[e.key - 1]) select(ids[e.key - 1]);
  else if (e.key === 'ArrowRight') select(ids[(i + 1) % ids.length]);
  else if (e.key === 'ArrowLeft') select(ids[(i - 1 + ids.length) % ids.length]);
});

function load(){
  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(e => $('upd').textContent = 'Error: ' + e.message)
    .getDashboardData();
}
load();
setInterval(load, REFRESH_MS);
</script>
<script>
/* ---- App (slider) के अंदर चले तो: swipe / [ ] keys से page बदलें. अकेले खोलने पर कुछ नहीं करता ---- */
(function(){
  if (window.top === window.self) return;
  function send(dir){ var w = window; while (w !== window.top) { w = w.parent; try { w.postMessage({loomNav: dir}, '*'); } catch(e){} } }
  function hScroll(el){ for (; el && el !== document.body; el = el.parentElement) {
      var o = getComputedStyle(el).overflowX; if ((o === 'auto' || o === 'scroll') && el.scrollWidth > el.clientWidth + 2) return true; } return false; }
  var x0 = null, y0 = 0, skip = false;
  document.addEventListener('touchstart', function(e){ var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; skip = hScroll(e.target); }, {passive:true});
  document.addEventListener('touchend', function(e){
    if (x0 === null || skip) return; var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) send(dx < 0 ? 1 : -1);
  }, {passive:true});
  document.addEventListener('keydown', function(e){
    if (e.key === ']' || e.key === 'PageDown') send(1);
    if (e.key === '[' || e.key === 'PageUp')   send(-1);
  });
})();
</script>
