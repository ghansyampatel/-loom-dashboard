<!DOCTYPE html>
<html>
<head>
<!-- © 2026 Factory Monitor — All rights reserved -->
<meta name="robots" content="noindex">
<script src="../api.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom Floor</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#000; --surface:#141414; --surface-2:#1d1d1d; --line:#2a2a2a;
    --text:#fff; --text-2:#c3c2b7; --muted:#8b8a83;
    --run:#16a34a; --stop:#eab308; --off:#dc2626; --offline:#3f3f46;
    --good:#22c55e; --warn:#facc15; --bad:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
  body{padding:clamp(8px,.8vw,16px);display:flex;flex-direction:column;gap:clamp(8px,.7vw,14px)}

  /* ---------- ऊपर: कुल गिनती ---------- */
  header{display:flex;align-items:center;gap:clamp(8px,1vw,20px);flex-wrap:wrap}
  .title h1{font-size:clamp(18px,1.6vw,34px);color:#0ff;letter-spacing:.12em;line-height:1}
  .title .sub{font-size:clamp(11px,.8vw,15px);color:var(--text-2);margin-top:4px}
  .totals{display:flex;gap:clamp(6px,.6vw,12px);flex:1;flex-wrap:wrap}
  .tot{border-radius:12px;padding:clamp(6px,.5vw,10px) clamp(10px,1vw,20px);min-width:clamp(80px,7vw,150px);
       cursor:pointer;border:3px solid transparent;user-select:none}
  .tot.on{border-color:#fff}
  .tot span{display:block;font-size:clamp(11px,.8vw,16px);font-weight:700;letter-spacing:.06em}
  .tot b{font-size:clamp(26px,2.6vw,54px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .tot.all{background:var(--surface-2)}
  .tot.RUN{background:var(--run)} .tot.STOP{background:var(--stop);color:#000}
  .tot.OFF{background:var(--off)} .tot.OFFLINE{background:var(--offline)}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(6px,.5vw,10px) clamp(10px,1vw,20px)}
  .kpi span{display:block;font-size:clamp(11px,.8vw,16px);color:var(--muted);font-weight:700;letter-spacing:.06em}
  .kpi b{font-size:clamp(22px,2.2vw,46px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .kpi small{font-size:.45em;color:var(--text-2);font-weight:600}
  .clock{font-size:clamp(18px,1.8vw,38px);font-weight:900;font-variant-numeric:tabular-nums;margin-left:auto;text-align:right}
  .clock div{font-size:clamp(11px,.8vw,15px);color:var(--text-2);font-weight:400}
  .shiftbar{height:6px;background:#262626;border-radius:10px;overflow:hidden;margin-top:4px}
  .shiftbar i{display:block;height:100%;background:#38bdf8}

  /* ---------- सारे looms ---------- */
  .grid{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);grid-auto-rows:var(--rowh,auto);gap:clamp(6px,.6vw,12px)}
  /* card के अंदर का साइज़ card के width/height से (cqmin) — TV, laptop, phone सब पर फ़िट */
  .card{container-type:inline-size;border-radius:12px;padding:clamp(5px,.75vw,16px) clamp(7px,.9vw,18px);
        display:flex;flex-direction:column;justify-content:space-between;gap:clamp(2px,.3vw,8px);cursor:pointer;overflow:hidden;
        border:3px solid transparent;min-height:0}
  .grid.fixed .card{container-type:size}
  .card:hover{border-color:#fff}
  .card.RUN{background:var(--run)}
  .card.STOP{background:var(--stop);color:#000}
  .card.OFF{background:var(--off)}
  .card.OFFLINE{background:var(--offline);color:#d4d4d8}
  .c1{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
  .c1 b{font-size:clamp(18px,19cqmin,72px);font-weight:900;line-height:.95}
  .c1 .st{font-size:clamp(10px,8cqmin,28px);font-weight:900;letter-spacing:.04em;white-space:nowrap;text-align:right;line-height:1.1}
  .c1 .esp{display:block;font-size:clamp(9px,5.5cqmin,16px);font-weight:400;opacity:.8;letter-spacing:0}
  .eff{font-size:clamp(24px,27cqmin,104px);font-weight:900;line-height:.95;font-variant-numeric:tabular-nums}
  .eff small{font-size:.36em;font-weight:700;opacity:.85}
  .c3{display:grid;grid-template-columns:1fr 1fr;gap:clamp(3px,2cqmin,8px)}
  .c3 div{background:rgba(0,0,0,.28);border-radius:8px;padding:clamp(2px,1.6cqmin,6px) clamp(4px,3cqmin,10px)}
  .card.STOP .c3 div{background:rgba(0,0,0,.14)}
  .c3 span{display:block;font-size:clamp(9px,6cqmin,17px);font-weight:700;opacity:.85;line-height:1.1}
  .c3 b{font-size:clamp(14px,14cqmin,46px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05}
  .c4{display:flex;justify-content:space-between;gap:6px;font-size:clamp(9px,6.5cqmin,19px);font-weight:700;opacity:.9;font-variant-numeric:tabular-nums;white-space:nowrap}

  @media (max-width:760px){
    header{flex-direction:column;align-items:stretch}
    .totals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .tot{min-width:0;padding:6px 8px}
    .tot span{font-size:10px;letter-spacing:0}
    .kpi.a{grid-column:span 2} .kpi.b{grid-column:span 3}
    .clock{margin-left:0;text-align:left}
  }

  /* ---------- एक loom का पूरा detail (popup) ---------- */
  #pop{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
  #pop.show{display:flex}
  .box{background:var(--surface);border:3px solid var(--sc);border-radius:16px;padding:clamp(14px,1.4vw,28px);width:min(760px,100%);max-height:100%;overflow:auto}
  .bh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
  .bh h2{font-size:clamp(26px,2.4vw,44px)}
  .bh h2 span{font-size:.5em;color:var(--text-2);font-weight:400;margin-left:8px}
  .bh .st{background:var(--sc);color:#000;font-weight:900;padding:.3em .9em;border-radius:30px;font-size:clamp(14px,1.2vw,22px)}
  .bh button{font:inherit;font-size:22px;background:none;border:none;color:var(--text);cursor:pointer;padding:0 6px}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kv div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
  .kv span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .kv b{font-size:clamp(18px,1.5vw,28px);font-variant-numeric:tabular-nums}
  .kv em{font-style:normal;font-size:.55em;color:var(--muted);font-weight:400}
  .hint{font-size:12px;color:var(--muted);margin-top:12px}

  /* ---------- Quality गोला: सफ़ेद + काली दोहरी लकीर → हरे / पीले / लाल / स्लेटी हर card पर दिखे ---------- */
  .qd{display:inline-block;width:.62em;height:.62em;border-radius:50%;background:var(--q);vertical-align:.08em;
      margin-left:.28em;border:.09em solid #fff;box-shadow:0 0 0 .07em #000;flex:none}
  .c1 b{display:flex;align-items:center}
  .warn{background:#000;color:#fde047;border-radius:6px;padding:clamp(1px,1cqmin,4px) clamp(4px,2.5cqmin,8px);
        font-size:clamp(9px,6.2cqmin,18px);font-weight:900;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .warn.red{color:#fca5a5}
  .qleg{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ql{display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:30px;
      padding:4px 10px 4px 6px;font-size:clamp(11px,.8vw,15px);font-weight:700;cursor:pointer;user-select:none;white-space:nowrap}
  .ql.on{border-color:#fff}
  .ql .qd{width:16px;height:16px;margin:0;border-width:2px;box-shadow:0 0 0 1.5px #000}
  .ql em{font-style:normal;color:var(--muted)}

  /* popup: quality चुनना + next beam */
  .sec{margin-top:14px;background:var(--surface-2);border-radius:12px;padding:12px}
  .sec h3{font-size:13px;color:var(--muted);letter-spacing:.06em;margin-bottom:8px}
  .qpick{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .qp{width:38px;height:38px;border-radius:50%;background:var(--q);border:3px solid #fff;box-shadow:0 0 0 2px #000;cursor:pointer;position:relative}
  .qp.none{background:repeating-linear-gradient(45deg,#333 0 5px,#555 5px 10px)}
  .qp.sel::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;
      color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
  .qp.sel.light::after{color:#000;text-shadow:none}
  .qname{font-size:13px;color:var(--text-2);margin-left:4px}
  .nb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .nb label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
  .nb input{font:inherit;font-size:16px;padding:8px;border-radius:8px;border:1px solid #444;background:#0b0b0b;color:#fff;width:100%}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btns button,.pinrow button{font:inherit;font-weight:800;font-size:14px;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
  .b1{background:#16a34a;color:#fff} .b2{background:#f59e0b;color:#000} .b3{background:#333;color:#fff}
  .msg{font-size:13px;margin-top:8px;min-height:1em}
  .msg.ok{color:#4ade80} .msg.err{color:#f87171}
  .pinrow{display:flex;gap:8px;align-items:center;margin-top:10px}
  .pinrow input{font:inherit;font-size:16px;padding:8px;border-radius:8px;border:1px solid #444;background:#0b0b0b;color:#fff;width:120px}
  @media (max-width:520px){ .nb{grid-template-columns:1fr 1fr} }
  .empty{color:var(--muted);padding:30px;text-align:center;grid-column:1/-1}
</style>
</head>
<body>
  <header>
    <div class="title">
      <h1 id="ttl">LOOM FLOOR</h1>
      <div class="sub" id="upd">Loading…</div>
    </div>
    <div class="totals" id="totals"></div>
    <div class="qleg" id="qleg"></div>
    <div class="clock"><span id="clock">--:--:--</span><div id="shiftTxt"></div><div class="shiftbar"><i id="shiftBar" style="width:0%"></i></div></div>
  </header>

  <div class="grid" id="grid"><div class="empty">Loading…</div></div>

  <div id="pop"><div class="box" id="box"></div></div>

<script>
const REFRESH_MS    = 15000;
const perEsp = () => (DATA && DATA.loomsPerEsp) || 4;
const grpLbl = () => esc((DATA && DATA.groupLabel) || 'ESP');   // Settings: Looms_Per_ESP (4 या 8) — सिर्फ़ card पर ESP नंबर
const ST_NAME = { RUN: 'RUN', STOP: 'STOP', OFF: 'OFF', OFFLINE: 'OFFLINE' };
const ST_VAR  = { RUN: 'var(--run)', STOP: 'var(--stop)', OFF: 'var(--off)', OFFLINE: '#a1a1aa' };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1 = n => (Math.round((n || 0) * 10) / 10).toFixed(1);
function hm(s){ s = Math.round(s || 0); return Math.floor(s / 3600) + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0'); }
function hms(s){ s = Math.round(s || 0); return hm(s) + ':' + String(s % 60).padStart(2, '0'); }
const num = id => parseInt(String(id).replace(/\D/g, ''), 10) || 0;
const stOf = l => ST_NAME[l.status] ? l.status : 'OFFLINE';

let DATA = null, filter = 'ALL', qfilter = '', openId = null, editing = false;
try { filter = localStorage.getItem('floorFilter') || 'ALL'; qfilter = localStorage.getItem('floorQ') || ''; } catch (e) {}
let PIN = '';
try { PIN = localStorage.getItem('loomPin') || ''; } catch (e) {}

// ---------- Quality (रंग) ----------
const QMAP = () => { const m = {}; ((DATA && DATA.qualities) || []).forEach(q => m[q.key] = q); return m; };
function qdot(key){ const q = QMAP()[key]; return q ? `<i class="qd" style="--q:${q.color}" title="${esc(q.name)}"></i>` : ''; }
function qname(key){ const q = QMAP()[key]; return q ? q.name : ''; }

// beam ख़त्म / next beam चेतावनी (card पर काली पट्टी — हर रंग पर पढ़ी जाए)
function beamWarn(l, full){
  if (l.noData) return '';
  if (l.beamWait) return `<div class="warn red">⚠ BEAM END ${esc(l.beamWait)}${full ? ' · नया beam भरें ("यह beam लग चुका है")' : ''}</div>`;
  const left = (l.beamLen || 0) - (l.beamM || 0);
  const warnM = DATA && DATA.beamWarnM != null ? DATA.beamWarnM : 50;
  if (l.beamLen > 0 && left <= warnM && !l.nextBeam) return `<div class="warn">⚠ ${Math.max(0, Math.round(left))} m · NEXT BEAM भरें</div>`;
  return '';
}

setInterval(() => $('clock').textContent = new Date().toLocaleTimeString('en-IN', {hour12:false}), 1000);

// ---------- एक loom card ----------
function card(l){
  const st = stOf(l);
  const n = num(l.id);
  const esp = n ? grpLbl() + Math.ceil(n / perEsp()) : '';
  return `<div class="card ${st}" data-id="${esc(l.id)}">
    <div class="c1"><b>${esc(l.id)}${qdot(l.qual)}</b><div class="st">${l.noData ? 'NO DATA' : st}<span class="esp">${esp}</span></div></div>
    <div class="eff">${l.noData ? '--' : Math.round(l.eff || 0)}<small>% eff</small></div>
    <div class="c3">
      <div><span>ON</span><b>${hm(l.runS)}</b></div>
      <div><span>OFF</span><b>${hm(l.stopS)}</b></div>
    </div>
    ${beamWarn(l)}
    <div class="c4"><span>${f1(l.shiftM)} / ${Math.round(l.target || 0)} m</span><span>${Math.round(l.rpm || 0)} rpm</span></div>
  </div>`;
}

// ---------- popup detail ----------
function showPop(l){
  const st = stOf(l);
  const run = l.runS || 0, stop = l.stopS || 0;
  const runPct = run + stop > 0 ? Math.round(run / (run + stop) * 100) : 0;
  const ach = l.planNow > 0 ? Math.round(l.shiftM / l.planNow * 100) : 0;
  const n = num(l.id);
  const kv = [
    ['Efficiency', f1(l.eff) + '<em>%</em>'],
    ['ON (run)', hms(run) + ' <em>' + runPct + '%</em>'],
    ['OFF (stop)', hms(stop)],
    ['Shift meters', f1(l.shiftM) + ' <em>/ ' + f1(l.target) + ' m</em>'],
    ['Plan अभी तक', f1(l.planNow) + ' <em>m · ' + ach + '%</em>'],
    ['RPM', Math.round(l.rpm || 0) + ' <em>/ ' + (l.rpmMode === 'AUTO' ? 'auto ' + (l.setRpm ? Math.round(l.setRpm) : 'सीख रहा') : 'set ' + Math.round(l.setRpm || 0)) + '</em>'],
    ['Short stops', (l.shortStops || 0) + ' <em>' + hms(l.shortStopS) + '</em>'],
    ['Picks', (l.picks || 0).toLocaleString('en-IN')],
    ['Beam', (esc(l.beam) || '-') + ' <em>' + f1(l.beamM) + ' / ' + Math.round(l.beamLen || 0) + ' m</em>'],
    ['Beam left', Math.round(Math.max(0, (l.beamLen || 0) - (l.beamM || 0))) + ' <em>m</em>'],
    ['PPM', Math.round(l.ppm || l.cfgPpm || 0)],
    ['Quality', l.qual ? qdot(l.qual) + ' ' + esc(qname(l.qual)) : '-'],
    ['WiFi', (esc(l.rssi) || '-') + ' <em>dBm</em>'],
    ['Updated', esc(l.updated)],
  ].map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('');
  $('box').style.setProperty('--sc', ST_VAR[st]);
  $('box').innerHTML = `<div class="bh"><h2>${esc(l.id)}<span>${esc(l.name)}${n ? ' · ' + grpLbl() + Math.ceil(n / perEsp()) : ''}</span></h2>
      <div style="display:flex;align-items:center;gap:10px"><div class="st">${l.noData ? 'NO DATA' : st}</div><button id="x" aria-label="close">✕</button></div></div>
    ${beamWarn(l, true)}
    <div class="kv">${kv}</div>
    ${editHtml(l)}
    <div class="hint">बंद करने के लिए ✕, Esc या बाहर कहीं भी दबाएँ · ← → से अगला loom</div>`;
  editing = false;
  $('pop').classList.add('show');
  openId = l.id;
}
function closePop(){ $('pop').classList.remove('show'); openId = null; editing = false; }

// ---------- popup: Quality चुनना + NEXT BEAM भरना ----------
function qpicker(name, cur){
  const qs = (DATA && DATA.qualities) || [];
  return `<div class="qpick" data-qgroup="${name}">` +
    qs.map(q => `<div class="qp ${cur === q.key ? 'sel' : ''} ${q.key === 'WHITE' ? 'light' : ''}" style="--q:${q.color}" data-q="${q.key}" title="${esc(q.name)}"></div>`).join('') +
    `<div class="qp none ${!cur ? 'sel' : ''}" data-q="" title="कोई नहीं"></div>` +
    `<span class="qname">${esc(qname(cur) || 'कोई नहीं')}</span></div>`;
}
function editHtml(l){
  if (l.noData && !l.cfgBeam) return '';
  const pin = DATA && DATA.pinNeeded ? `<div class="pinrow"><span style="font-size:12px;color:var(--muted)">PIN</span><input id="pin" type="password" inputmode="numeric" value="${esc(PIN)}"></div>` : '';
  return `<div class="sec"><h3>QUALITY (अभी का beam)</h3>${qpicker('qual', l.qual)}
      <div class="btns"><button class="b1" data-act="q">SAVE QUALITY</button></div></div>
    <div class="sec"><h3>NEXT BEAM ${l.nextBeam ? '· भरा हुआ: ' + esc(l.nextBeam) : '· (पहले से भरें, beam ख़त्म होते ही अपने आप लगेगा)'}</h3>
      <div class="nb">
        <label>Beam No.<input id="nbNo" value="${esc(l.nextBeam)}" maxlength="20" placeholder="B-102"></label>
        <label>Length (m)<input id="nbLen" type="number" inputmode="decimal" value="${l.nextLen || ''}" placeholder="${Math.round(l.beamLen || 0) || 1000}"></label>
        <label>PPM<input id="nbPpm" type="number" inputmode="decimal" value="${l.nextPpm || ''}" placeholder="${Math.round(l.ppm || l.cfgPpm || 0) || 2000}"></label>
      </div>
      ${qpicker('nextQual', l.nextQual)}
      <div class="btns">
        <button class="b1" data-act="next">SAVE NEXT BEAM</button>
        <button class="b2" data-act="now">यह beam लग चुका है</button>
        ${l.nextBeam ? '<button class="b3" data-act="clear">Next हटाएँ</button>' : ''}
      </div>
      <div class="hint" style="margin-top:6px">"यह beam लग चुका है" = beam पहले ही बदल चुका (जैसे रात में). Loom चल रही हो तो ESP32 आख़िरी लंबे रुकाव${l.beamWait ? ' (' + esc(l.beamWait) + ')' : ''} से नया beam गिनेगा.</div>
      ${pin}
      <div class="msg" id="msg"></div></div>`;
}
function picked(group){ const g = document.querySelector(`[data-qgroup="${group}"] .qp.sel`); return g ? g.dataset.q : ''; }
function sendEdit(act){
  const l = DATA.looms.find(x => x.id === openId); if (!l) return;
  const pinEl = $('pin'); if (pinEl) { PIN = pinEl.value.trim(); try { localStorage.setItem('loomPin', PIN); } catch (e) {} }
  let d;
  if (act === 'q') d = { qual: picked('qual') };
  else if (act === 'clear') d = { nextBeam: '' };
  else {
    const no = $('nbNo').value.trim();
    if (!no) { msg('Next beam नंबर भरें', true); return; }
    d = { nextBeam: no, nextLen: $('nbLen').value, nextPpm: $('nbPpm').value, nextQual: picked('nextQual') };
    if (act === 'now') {
      if (no === l.beam) { msg('यही beam पहले से लगा है', true); return; }
      if (!confirmNow) { confirmNow = true; msg('पक्का? ' + l.beam + ' → ' + no + ' — फिर से दबाएँ', true); return; }
      d.beamNow = true;
    }
  }
  confirmNow = false;
  msg('Save हो रहा है…');
  google.script.run
    .withSuccessHandler(r => { msg('✓ Save हो गया — ESP32 अगले upload (15 s) में ले लेगा'); editing = false;
      Object.assign(l, { qual: r.cfg.qual, nextBeam: r.cfg.nextBeam, nextLen: r.cfg.nextLen, nextPpm: r.cfg.nextPpm, nextQual: r.cfg.nextQual, cfgBeam: r.cfg.beam });
      setTimeout(load, 800); })
    .withFailureHandler(e => msg('✗ ' + e.message, true))
    .saveLoomEdit(l.id, d, PIN);
}
let confirmNow = false;
function msg(t, err){ const m = $('msg'); if (m) { m.textContent = t; m.className = 'msg ' + (err ? 'err' : 'ok'); } }

// ---------- 20 cards एक ही screen पर फ़िट करना ----------
function fit(count){
  const w = window.innerWidth, h = window.innerHeight;
  let cols = w >= 1250 ? 5 : w >= 1000 ? 4 : w >= 700 ? 3 : 2;
  const g = $('grid');
  const tv = w >= 1000 && w > h;
  const top = g.getBoundingClientRect().top + window.scrollY;
  const gap = parseFloat(getComputedStyle(g).rowGap) || 10;
  if (tv && count > 20) {                           // 48 looms जैसे: कॉलम बढ़ाओ ताकि सब एक screen में आएँ
    for (let c = cols; c <= 12; c++) {
      cols = c;
      const r = Math.ceil(count / c);
      if ((h - top - 12 - gap * (r - 1)) / r >= 135 || w / (c + 1) < 165) break;
    }
  }
  if (count && count < cols) cols = count;
  const rows = Math.max(1, Math.ceil(count / cols));
  g.style.setProperty('--cols', cols);
  if (tv) {                                         // TV / laptop: सब एक screen में
    const avail = h - top - 12 - gap * (rows - 1);
    g.style.setProperty('--rowh', Math.max(130, Math.floor(avail / rows)) + 'px');
    g.classList.add('fixed');
  } else {
    g.style.setProperty('--rowh', 'auto');
    g.classList.remove('fixed');
  }
}

function render(d){
  if (d) DATA = d;
  d = DATA;
  if (!d) return;
  if (d.company) $('ttl').textContent = d.company.toUpperCase() + ' · FLOOR';
  $('upd').textContent = 'Updated ' + d.server + ' · हर 15 सेकंड';
  const s = d.shiftNow || {};
  $('shiftTxt').textContent = (s.name || '') + ' shift ' + (s.elapsedTxt || '') + ' / ' + (s.lenTxt || '');
  $('shiftBar').style.width = (s.pct || 0) + '%';

  const L = (d.looms || []).slice().sort((a, b) => num(a.id) - num(b.id) || String(a.id).localeCompare(String(b.id)));
  const cnt = { RUN: 0, STOP: 0, OFF: 0, OFFLINE: 0 };
  L.forEach(l => cnt[stOf(l)]++);
  const live = L.filter(l => stOf(l) !== 'OFFLINE');
  const avgEff = live.length ? live.reduce((a, l) => a + (l.eff || 0), 0) / live.length : 0;
  const meters = L.reduce((a, l) => a + (l.shiftM || 0), 0);
  const plan = L.reduce((a, l) => a + (l.noData ? 0 : (l.planNow || 0)), 0);

  const chip = (k, label, v) => `<div class="tot ${k === 'ALL' ? 'all' : k} ${filter === k ? 'on' : ''}" data-f="${k}"><span>${label}</span><b>${v}</b></div>`;
  $('totals').innerHTML =
    chip('ALL', 'TOTAL', L.length) + chip('RUN', 'ON / RUN', cnt.RUN) + chip('STOP', 'STOP', cnt.STOP) +
    chip('OFFLINE', 'OFFLINE', cnt.OFFLINE) +
    `<div class="kpi a"><span>AVG EFF</span><b>${f1(avgEff)}<small>%</small></b></div>` +
    `<div class="kpi b"><span>SHIFT METERS</span><b>${Math.round(meters).toLocaleString('en-IN')}<small> / plan ${Math.round(plan).toLocaleString('en-IN')} m</small></b></div>`;

  const qs = d.qualities || [];
  const used = qs.filter(q => L.some(l => l.qual === q.key));
  $('qleg').innerHTML = used.length ? used.map(q => `<div class="ql ${qfilter === q.key ? 'on' : ''}" data-qf="${q.key}"><i class="qd" style="--q:${q.color}"></i>${esc(q.name)} <em>${L.filter(l => l.qual === q.key).length}</em></div>`).join('') : '';
  if (qfilter && !used.some(q => q.key === qfilter)) qfilter = '';
  const show = L.filter(l => (filter === 'ALL' || stOf(l) === filter) && (!qfilter || l.qual === qfilter));
  $('grid').innerHTML = show.length ? show.map(card).join('') : '<div class="empty">इस status में कोई loom नहीं</div>';
  fit(show.length);

  if (openId && !editing) { const l = L.find(x => x.id === openId); l ? showPop(l) : closePop(); }
}

document.addEventListener('click', e => {
  const t = e.target;
  const f = t.closest('[data-f]');
  if (f) { filter = f.dataset.f === filter ? 'ALL' : f.dataset.f; try { localStorage.setItem('floorFilter', filter); } catch (x) {} render(); return; }
  const qf = t.closest('[data-qf]');
  if (qf) { qfilter = qf.dataset.qf === qfilter ? '' : qf.dataset.qf; try { localStorage.setItem('floorQ', qfilter); } catch (x) {} render(); return; }
  const qp = t.closest('.qp');
  if (qp) { const g = qp.parentElement; g.querySelectorAll('.qp').forEach(x => x.classList.remove('sel')); qp.classList.add('sel');
            g.querySelector('.qname').textContent = qname(qp.dataset.q) || 'कोई नहीं'; editing = true; return; }
  const act = t.closest('[data-act]');
  if (act) { editing = true; sendEdit(act.dataset.act); return; }
  if (t.id === 'x' || t.id === 'pop') { closePop(); return; }
  if (t.closest('#box')) return;
  const c = t.closest('.card');
  if (c && DATA) showPop(DATA.looms.find(l => l.id === c.dataset.id));
});
document.addEventListener('input', () => { editing = true; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closePop();
  if (e.target && e.target.tagName === 'INPUT') return;
  if (!openId || !DATA) return;
  const ids = DATA.looms.map(l => l.id).sort((a, b) => num(a) - num(b));
  const i = ids.indexOf(openId);
  if (e.key === 'ArrowRight') showPop(DATA.looms.find(l => l.id === ids[(i + 1) % ids.length]));
  if (e.key === 'ArrowLeft')  showPop(DATA.looms.find(l => l.id === ids[(i - 1 + ids.length) % ids.length]));
});
window.addEventListener('resize', () => DATA && fit($('grid').children.length));

function load(){
  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(e => $('upd').textContent = 'Error: ' + e.message)
    .getDashboardData();
}
load();
setInterval(load, REFRESH_MS);
</script>
<script>
/* ---- App (slider) के अंदर चले तो: swipe / [ ] keys से page बदलें. अकेले खोलने पर कुछ नहीं करता ---- */
(function(){
  if (window.top === window.self) return;
  function send(dir){ var w = window; while (w !== window.top) { w = w.parent; try { w.postMessage({loomNav: dir}, '*'); } catch(e){} } }
  function hScroll(el){ for (; el && el !== document.body; el = el.parentElement) {
      var o = getComputedStyle(el).overflowX; if ((o === 'auto' || o === 'scroll') && el.scrollWidth > el.clientWidth + 2) return true; } return false; }
  var x0 = null, y0 = 0, skip = false;
  document.addEventListener('touchstart', function(e){ var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; skip = hScroll(e.target); }, {passive:true});
  document.addEventListener('touchend', function(e){
    if (x0 === null || skip) return; var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) send(dx < 0 ? 1 : -1);
  }, {passive:true});
  document.addEventListener('keydown', function(e){
    if (e.key === ']' || e.key === 'PageDown') send(1);
    if (e.key === '[' || e.key === 'PageUp')   send(-1);
  });
})();
</script>
